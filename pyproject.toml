[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hme-bitwarden"
version = "1.0.0"
description = "Use iCloud+ Hide My Email as an email forwarder in the Bitwarden username generator."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Dennis" }]
keywords = ["bitwarden", "icloud", "hide-my-email", "email-alias", "self-hosted"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Communications :: Email",
  "Topic :: Security",
]
dependencies = [
  "pyicloud==2.7.0",
  # pyicloud 2.7.0 imports rich but does not declare it as a dependency
  "rich>=13",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.18",
  "itsdangerous>=2.2,<3",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx2>=2", "ruff>=0.6"]

[project.scripts]
hme-bitwarden = "hme_bitwarden.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hme_bitwarden = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
